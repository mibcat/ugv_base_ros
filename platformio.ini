; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes

custom_ota_name = esp32-robi

board_build.flash_mode = qio
board_build.flash_size = 4MB
extra_scripts = pre:get_commit_id.py
build_flags = 
	-IROS_Driver
	-DENABLE_HTTP_SERVER=0
	-DENABLE_GIMBAL=1
	-DENABLE_ROARM=0
	-DENABLE_WIRELESS=1
	-DENABLE_ESPNOW=0
	-DENABLE_OTA=1
	-DOTA_HOST_NAME=\"${this.custom_ota_name}\"
lib_deps = 
	bblanchon/ArduinoJson@^6
	adafruit/Adafruit SSD1306
	wollewald/INA219_WE
	madhephaestus/ESP32Encoder
	git+https://github.com/imax9000/Arduino-PID-Library.git
	denyssene/SimpleKalmanFilter
	wollewald/ICM20948_WE@^1.2.8
lib_archive = no

; upload via serial port
[env:esp32dev-usb]
upload_speed = 921600
upload_port = /dev/ttyACM0

; upload via OTA
[env:esp32dev-ota]
upload_port = ${this.custom_ota_name}.local
upload_protocol = espota
